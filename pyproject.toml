[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "impark"
version = "0.1.0"
description = "IMPARK academic agentic-system foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pillow>=11,<13",
  "opentelemetry-api>=1.27,<2",
  "neo4j>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "asyncpg>=0.30,<1",
  "qdrant-client>=1.13,<1.15",
  "fastembed>=0.7,<1",
  "rapidfuzz>=3.10,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
image = ["tensorflow>=2.20,<2.22"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1.4,<2", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.database.postgres" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["neo4j_integration: explicit opt-in tests against a configured local Neo4j database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
