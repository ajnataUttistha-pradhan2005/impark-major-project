# ==============================================================================
# IMPARK Distributed Event-Driven Evaluator & Observability Pipeline
# Infrastructure Stack: Redis 7 Alpine, PostgreSQL 16 Alpine, Grafana
# ==============================================================================

services:
  # 1. Message Broker: Redis 7 Alpine (~20MB RAM, Redis Streams with AOF persistence)
  redis:
    image: redis:7-alpine
    container_name: eval-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - eval-network

  # 2. Unified Storage: PostgreSQL 16 Alpine (~40MB RAM, JSONB + Relational Metrics)
  postgres:
    image: postgres:16-alpine
    container_name: eval-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: phoenix
    ports:
      - "${EVAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phoenix"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - eval-network

  # 3. Observability & Tracing Backend: Arize Phoenix (UI: 6006, OTLP gRPC: 4317)
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: eval-phoenix
    environment:
      # Directs Arize Phoenix to persist all traces, spans, and evaluations in PostgreSQL
      - PHOENIX_SQL_DATABASE_URL=postgresql://postgres:password@postgres:5432/phoenix
      - PHOENIX_PORT=6006
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_GRPC_PORT=4317
    ports:
      - "6006:6006"
      - "4317:4317"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eval-network

  # 4. Visualization Layer: Grafana (~60MB RAM)
  grafana:
    image: grafana/grafana:latest
    container_name: eval-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - eval-network

  # 4. Optional Containerized Evaluator Daemon (can run on host or via docker profile)
  evaluator-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eval-worker
    profiles: ["worker", "all"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=eval_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eval-network

volumes:
  redisdata:
    name: eval_redisdata
  pgdata:
    name: eval_pgdata
  grafanadata:
    name: eval_grafanadata

networks:
  eval-network:
    name: eval-network
    driver: bridge
