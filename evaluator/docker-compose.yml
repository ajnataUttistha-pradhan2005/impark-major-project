# ==============================================================================
# IMPARK Evaluator & Observability Pipeline (Arize Phoenix + LLM-as-a-Judge)
# Infrastructure Stack: Redis 7 Alpine, PostgreSQL 16 Alpine, Arize Phoenix
# ==============================================================================

services:
  # 1. Message Broker: Redis 7 Alpine (~20MB RAM, Redis Streams with AOF persistence)
  redis:
    image: redis:7-alpine
    container_name: eval-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - eval-network

  # 2. Unified Storage: PostgreSQL 16 Alpine (Persists traces, spans, and evaluations)
  postgres:
    image: postgres:16-alpine
    container_name: eval-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: phoenix
    ports:
      - "${EVAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - eval-network

  # 3. Observability & Tracing Backend: Arize Phoenix (UI: 6006, OTLP gRPC: 4317)
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: eval-phoenix
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://postgres:password@postgres:5432/phoenix
      - PHOENIX_PORT=6006
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_GRPC_PORT=4317
    ports:
      - "6006:6006"
      - "4317:4317"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eval-network

volumes:
  redisdata:
    name: eval_redisdata
  pgdata:
    name: eval_pgdata

networks:
  eval-network:
    name: eval-network
    driver: bridge
