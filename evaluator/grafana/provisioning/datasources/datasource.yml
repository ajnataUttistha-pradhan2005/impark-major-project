apiVersion: 1

datasources:
  - name: PostgreSQL-Eval
    type: postgres
    access: proxy
    url: postgres:5432
    user: postgres
    secureJsonData:
      password: "password"
    jsonData:
      database: eval_db
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
